<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0,
               maximum-scale=1.0, user-scalable=no">

<title>DESTINY BOT</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, Helvetica, sans-serif;
    background: #071b2f;
    color: #ffffff;
}

.container {
    width: 100%;
    max-width: 520px;
    margin: auto;
    padding: 15px;
}

.header {
    text-align: center;
    padding: 10px 0 18px;
}

.header h1 {
    margin: 0;
    font-size: 25px;
    font-weight: 800;
}

.header p {
    margin: 7px 0 0;
    color: #aebdca;
    font-size: 14px;
}

/* =========================
   MAIN MENU
========================= */

.menu {
    display: flex;
    flex-direction: column;
    gap: 10px;
}

.btn {
    border: 0;
    border-radius: 13px;
    min-height: 58px;
    width: 100%;
    color: white;
    font-size: 17px;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 3px 8px rgba(0,0,0,.30);
}

.blue {
    background: #1687d9;
}

.blue:active {
    background: #0f72ba;
    transform: scale(.98);
}

.green {
    background: #20b85a;
}

.green:active {
    background: #179447;
    transform: scale(.98);
}

/* Two-column menu */

.two-columns {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
}

/* =========================
   SCREENS
========================= */

.screen {
    display: none;
}

.screen.active {
    display: block;
}

/* =========================
   SERVICES
========================= */

.service-list {
    display: flex;
    flex-direction: column;
    gap: 9px;
}

.service {
    width: 100%;
    min-height: 60px;
    border: 0;
    border-radius: 13px;
    background: #1687d9;
    color: white;

    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;

    font-size: 18px;
    font-weight: 700;

    cursor: pointer;
    box-shadow: 0 3px 8px rgba(0,0,0,.30);
}

.service:active {
    background: #0f72ba;
    transform: scale(.98);
}

.service img {
    width: 30px;
    height: 30px;
    object-fit: contain;
    background: white;
    border-radius: 7px;
    padding: 3px;
}

/* =========================
   NUMBER DISPLAY
========================= */

.number-list {
    display: flex;
    flex-direction: column;
    gap: 9px;
}

.number-card {
    background: #1687d9;
    color: white;
    border-radius: 13px;
    padding: 15px;

    box-shadow: 0 3px 8px rgba(0,0,0,.30);
}

.number-card .number {
    font-size: 19px;
    font-weight: 800;
    text-align: center;
}

.number-card .country {
    margin-top: 5px;
    text-align: center;
    font-size: 13px;
    opacity: .9;
}

/* =========================
   GREEN ACTION BUTTONS
========================= */

.green-actions {
    display: flex;
    flex-direction: column;
    gap: 9px;
    margin-top: 12px;
}

.action-green {
    width: 100%;
    min-height: 55px;
    border: 0;
    border-radius: 13px;

    background: #20b85a;
    color: white;

    font-size: 17px;
    font-weight: 700;

    cursor: pointer;
    box-shadow: 0 3px 8px rgba(0,0,0,.30);
}

.action-green:active {
    background: #179447;
    transform: scale(.98);
}

/* =========================
   COUNTRY SCREEN
========================= */

.country-list {
    display: flex;
    flex-direction: column;
    gap: 9px;
}

.country {
    width: 100%;
    min-height: 57px;

    border: 0;
    border-radius: 13px;

    background: #1687d9;
    color: white;

    font-size: 18px;
    font-weight: 700;

    cursor: pointer;
    box-shadow: 0 3px 8px rgba(0,0,0,.30);
}

.country:active {
    background: #0f72ba;
    transform: scale(.98);
}

/* =========================
   BACK
========================= */

.back {
    margin-top: 12px;
    width: 100%;
    min-height: 56px;

    border: 0;
    border-radius: 13px;

    background: #20b85a;
    color: white;

    font-size: 17px;
    font-weight: 800;

    cursor: pointer;
    box-shadow: 0 3px 8px rgba(0,0,0,.30);
}

.back:active {
    background: #179447;
    transform: scale(.98);
}

/* =========================
   INFO BOX
========================= */

.info {
    background: rgba(255,255,255,.05);
    border-radius: 13px;
    padding: 15px;
    margin-bottom: 12px;
    text-align: center;
}

.info h2 {
    margin: 0;
    font-size: 20px;
}

.info p {
    margin: 6px 0 0;
    color: #aebdca;
    font-size: 14px;
}

/* =========================
   MOBILE
========================= */

@media (max-width: 380px) {

    .btn,
    .service,
    .country {
        min-height: 54px;
        font-size: 16px;
    }

    .two-columns {
        gap: 7px;
    }
}
</style>
</head>

<body>

<div class="container">

    <!-- =====================
         MAIN MENU
    ====================== -->

    <section id="homeScreen" class="screen active">

        <div class="header">
            <h1>DESTINY BOT</h1>
            <p>Welcome to Destiny</p>
        </div>

        <div class="menu">

            <!-- BLUE -->
            <button class="btn blue"
                    onclick="showScreen('serviceScreen')">
                GET NUMBER
            </button>

            <div class="two-columns">

                <button class="btn blue"
                        onclick="showMessage('LIVE TRAFFIC')">
                    LIVE TRAFFIC
                </button>

                <button class="btn blue"
                        onclick="showMessage('WITHDRAW')">
                    WITHDRAW
                </button>

                <button class="btn blue"
                        onclick="showMessage('HELP')">
                    HELP
                </button>

                <button class="btn blue"
                        onclick="showMessage('REFERRAL')">
                    REFERRAL
                </button>

            </div>

        </div>

    </section>


    <!-- =====================
         SERVICE SCREEN
    ====================== -->

    <section id="serviceScreen" class="screen">

        <div class="header">
            <h1>DESTINY BOT</h1>
            <p>Select a service</p>
        </div>

        <div class="service-list">

            <button class="service"
                    onclick="selectService('Google')">
                <img src="https://cdn.simpleicons.org/google"
                     alt="Google">
                Google
            </button>

            <button class="service"
                    onclick="selectService('Snapchat')">
                <img src="https://cdn.simpleicons.org/snapchat"
                     alt="Snapchat">
                Snapchat
            </button>

            <button class="service"
                    onclick="selectService('Telegram')">
                <img src="https://cdn.simpleicons.org/telegram"
                     alt="Telegram">
                Telegram
            </button>

            <button class="service"
                    onclick="selectService('Instagram')">
                <img src="https://cdn.simpleicons.org/instagram"
                     alt="Instagram">
                Instagram
            </button>

            <button class="service"
                    onclick="selectService('TikTok')">
                <img src="https://cdn.simpleicons.org/tiktok"
                     alt="TikTok">
                TikTok
            </button>

            <button class="service"
                    onclick="selectService('Discord')">
                <img src="https://cdn.simpleicons.org/discord"
                     alt="Discord">
                Discord
            </button>

            <button class="service"
                    onclick="selectService('Apple')">
                <img src="https://cdn.simpleicons.org/apple"
                     alt="Apple">
                Apple
            </button>

            <button class="service"
                    onclick="selectService('WhatsApp')">
                <img src="https://cdn.simpleicons.org/whatsapp"
                     alt="WhatsApp">
                WhatsApp
            </button>

        </div>

        <button class="back"
                onclick="showScreen('homeScreen')">
            ← BACK
        </button>

    </section>


    <!-- =====================
         COUNTRY SCREEN
    ====================== -->

    <section id="countryScreen" class="screen">

        <div class="header">
            <h1>DESTINY BOT</h1>
            <p id="countryService">Select a country</p>
        </div>

        <div class="country-list">

            <button class="country"
                    onclick="selectCountry('🇳🇬 Nigeria')">
                🇳🇬 Nigeria
            </button>

            <button class="country"
                    onclick="selectCountry('🇺🇸 USA')">
                🇺🇸 USA
            </button>

            <button class="country"
                    onclick="selectCountry('🇬🇧 United Kingdom')">
                🇬🇧 United Kingdom
            </button>

            <button class="country"
                    onclick="selectCountry('🇨🇦 Canada')">
                🇨🇦 Canada
            </button>

            <button class="country"
                    onclick="selectCountry('🇮🇳 India')">
                🇮🇳 India
            </button>

            <button class="country"
                    onclick="selectCountry('🇿🇦 South Africa')">
                🇿🇦 South Africa
            </button>

        </div>

        <!-- GREEN -->
        <div class="green-actions">

            <button class="action-green"
                    onclick="showMessage('CHANGE COUNTRY')">
                CHANGE COUNTRY
            </button>

            <button class="action-green"
                    onclick="showMessage('CHANGE NUMBER')">
                CHANGE NUMBER
            </button>

            <button class="action-green"
                    onclick="showMessage('OTP GROUP')">
                OTP GROUP
            </button>

        </div>

        <!-- GREEN -->
        <button class="back"
                onclick="showScreen('serviceScreen')">
            ← BACK
        </button>

    </section>


    <!-- =====================
         NUMBER SCREEN
    ====================== -->

    <section id="numberScreen" class="screen">

        <div class="header">
            <h1>DESTINY BOT</h1>
            <p>Available numbers</p>
        </div>

        <div class="info">
            <h2 id="selectedService">
                DESTINY BOT
            </h2>

            <p id="selectedCountry">
                Country
            </p>
        </div>

        <!-- BLUE NUMBER CARDS -->
        <div class="number-list">

            <div class="number-card">
                <div class="number">
                    Number available
                </div>
                <div class="country">
                    Available number
                </div>
            </div>

        </div>

        <!-- GREEN ACTIONS -->
        <div class="green-actions">

            <button class="action-green"
                    onclick="showScreen('countryScreen')">
                CHANGE COUNTRY
            </button>

            <button class="action-green"
                    onclick="showMessage('CHANGE NUMBER')">
                CHANGE NUMBER
            </button>

            <button class="action-green"
                    onclick="showMessage('OTP GROUP')">
                OTP GROUP
            </button>

        </div>

        <button class="back"
                onclick="showScreen('countryScreen')">
            ← BACK
        </button>

    </section>

</div>


<script>

const tg =
    window.Telegram &&
    window.Telegram.WebApp;

if (tg) {
    tg.ready();
    tg.expand();
}

let selectedService = "";
let selectedCountry = "";


function showScreen(id) {

    document
        .querySelectorAll(".screen")
        .forEach(screen => {
            screen.classList.remove("active");
        });

    document
        .getElementById(id)
        .classList.add("active");
}


function selectService(service) {

    selectedService = service;

    document
        .getElementById("countryService")
        .textContent =
        service + " • Select a country";

    showScreen("countryScreen");
}


function selectCountry(country) {

    selectedCountry = country;

    document
        .getElementById("selectedService")
        .textContent =
        selectedService;

    document
        .getElementById("selectedCountry")
        .textContent =
        country;

    showScreen("numberScreen");
}


function showMessage(title) {

    if (tg) {

        tg.showPopup({
            title: "DESTINY BOT",
            message: title,
            buttons: [
                {
                    id: "ok",
                    type: "ok",
                    text: "OK"
                }
            ]
        });

    } else {

        alert(title);

    }
}

</script>

</body>
</html>
